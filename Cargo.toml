[package]
name = "ad-stack"
version = "0.1.0"
authors = ["AD-Stack Contributors <contact@ad-stack.org>"]
license = "AGPL-3.0"
edition = "2021"
repository = "https://github.com/fahertym/AD-Stack"
homepage = "https://github.com/fahertym/AD-Stack"
description = "Open-source Active Directory replacement for SMBs"

[workspace]
members = [
    "cmd/ad-stack-cli",
    "cmd/orchestrator",
]
resolver = "2"

[dependencies]
# Async runtime and utilities
tokio = { version = "1.35", features = ["full"] }
tokio-util = "0.7"

# Web framework and HTTP
axum = { version = "0.7", features = ["json", "query", "tower-log"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
hyper = "1.0"

# Serialization and data handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Database integration
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }

# CLI parsing and configuration
clap = { version = "4.4", features = ["derive", "env"] }
config = "0.14"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1.5"
futures = "0.3"

# Security and authentication
jsonwebtoken = "9.2"
bcrypt = "0.15"
rand = "0.8"

# System integration
nix = "0.27"
libc = "0.2"

[dev-dependencies]
test-log = "0.2"
tempfile = "3.8"
mockall = "0.12"
criterion = "0.5"
tower = { version = "0.4", features = ["util"] }