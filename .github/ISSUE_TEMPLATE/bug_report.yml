name: Bug Report
description: Report a bug or issue with AD-Stack
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide as much detail as possible to help us resolve the issue quickly.

  - type: textarea
    id: bug-description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: A clear and concise description of what actually happened.
      placeholder: What actually happened?
    validations:
      required: true

  - type: input
    id: ad-stack-version
    attributes:
      label: AD-Stack Version
      description: What version of AD-Stack are you running?
      placeholder: v1.0.0
    validations:
      required: true

  - type: dropdown
    id: deployment-method
    attributes:
      label: Deployment Method
      description: How is AD-Stack deployed?
      options:
        - Docker Compose
        - Ansible Playbook
        - Manual Installation
        - Kubernetes
        - Other
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: Operating System
      description: What operating system are you using?
      options:
        - Ubuntu 22.04 LTS
        - Ubuntu 24.04 LTS
        - Rocky Linux 9
        - RHEL 9
        - Fedora 38+
        - Debian 12
        - Other Linux
        - Windows (WSL)
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser (if web UI issue)
      description: What browser are you using for the web interface?
      placeholder: Chrome 120, Firefox 121, etc.

  - type: textarea
    id: system-info
    attributes:
      label: System Information
      description: |
        Please provide system information. You can get this by running:
        ```bash
        uname -a
        free -h
        df -h
        ```
      placeholder: Paste system information here...

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: |
        Please provide relevant log output. You can get logs with:
        ```bash
        sudo journalctl -u ad-stack-orchestrator
        sudo tail -f /var/log/ad-stack/app.log
        ```
      placeholder: Paste relevant logs here...

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here.
      placeholder: Any additional information that might be helpful...

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      description: Please confirm the following before submitting
      options:
        - label: I have searched existing issues to ensure this is not a duplicate
          required: true
        - label: I have provided all required information above
          required: true
        - label: I am running a supported version of AD-Stack
          required: true
        - label: I have reviewed the troubleshooting documentation
          required: true