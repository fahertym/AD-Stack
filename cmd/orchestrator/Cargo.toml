[package]
name = "orchestrator"
version = "0.1.0"
authors = ["AD-Stack Contributors <contact@ad-stack.org>"]
license = "AGPL-3.0"
edition = "2021"
repository = "https://github.com/fahertym/AD-Stack"
homepage = "https://github.com/fahertym/AD-Stack"
description = "AD-Stack orchestration service"

[[bin]]
name = "orchestrator"
path = "main.rs"

[dependencies]
ad-stack = { path = "../.." }
tokio = { version = "1.35", features = ["full"] }
axum = { version = "0.7", features = ["json", "query", "tower-log"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1.0"