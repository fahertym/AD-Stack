[package]
name = "ad-stack-cli"
version = "0.1.0"
authors = ["AD-Stack Contributors <contact@ad-stack.org>"]
license = "AGPL-3.0"
edition = "2021"
repository = "https://github.com/fahertym/AD-Stack"
homepage = "https://github.com/fahertym/AD-Stack"
description = "Command-line interface for AD-Stack"

[[bin]]
name = "ad-stack"
path = "main.rs"

[dependencies]
ad-stack = { path = "../.." }
clap = { version = "4.4", features = ["derive", "env"] }
tokio = { version = "1.35", features = ["full"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1.0"