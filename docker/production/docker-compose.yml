version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: ad-stack-postgres
    environment:
      POSTGRES_DB: ad_stack
      POSTGRES_USER: ad-stack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ad-stack"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - ad-stack-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ad-stack-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - ad-stack-network

  # AD-Stack Orchestrator
  orchestrator:
    image: ghcr.io/fahertym/ad-stack:${AD_STACK_VERSION:-latest}
    container_name: ad-stack-orchestrator
    environment:
      - RUST_LOG=info
      - DATABASE_URL=postgresql://ad-stack:${POSTGRES_PASSWORD}@postgres:5432/ad_stack
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - AD_DOMAIN=${AD_DOMAIN}
      - AD_REALM=${AD_REALM}
      - AD_SERVER_IP=${AD_SERVER_IP}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - orchestrator_config:/etc/ad-stack
      - orchestrator_logs:/var/log/ad-stack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - ad-stack-network

  # Samba 4 AD DC
  samba:
    image: samuelrohrbach/samba4:latest
    container_name: ad-stack-samba
    environment:
      - DOMAIN=${AD_DOMAIN}
      - REALM=${AD_REALM}
      - ADMINPASS=${AD_ADMIN_PASSWORD}
      - DNSFORWARDER=${AD_DNS_FORWARDERS:-8.8.8.8}
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "88:88/tcp"
      - "88:88/udp"
      - "135:135/tcp"
      - "389:389/tcp"
      - "445:445/tcp"
      - "464:464/tcp"
      - "464:464/udp"
      - "636:636/tcp"
      - "3268:3268/tcp"
      - "3269:3269/tcp"
    volumes:
      - samba_config:/etc/samba
      - samba_data:/var/lib/samba
      - samba_logs:/var/log/samba
    privileged: true
    restart: unless-stopped
    networks:
      - ad-stack-network

  # Frontend (Production Build)
  frontend:
    image: ghcr.io/fahertym/ad-stack-ui:${AD_STACK_VERSION:-latest}
    container_name: ad-stack-frontend
    restart: unless-stopped
    networks:
      - ad-stack-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: ad-stack-nginx
    ports:
      - "443:443"
      - "80:80"
      - "9090:9090"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - orchestrator
      - frontend
    restart: unless-stopped
    networks:
      - ad-stack-network

  # Prometheus (Optional Monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: ad-stack-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    volumes:
      - prometheus_data:/prometheus
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - ad-stack-network
    profiles:
      - monitoring

  # Grafana (Optional Monitoring)
  grafana:
    image: grafana/grafana:latest
    container_name: ad-stack-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - ad-stack-network
    profiles:
      - monitoring

volumes:
  postgres_data:
  redis_data:
  samba_config:
  samba_data:
  samba_logs:
  orchestrator_config:
  orchestrator_logs:
  prometheus_data:
  grafana_data:

networks:
  ad-stack-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.21.0.0/16